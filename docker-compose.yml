services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foundersignal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - foundersignal_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  typesense:
    image: typesense/typesense:27.1
    command: "--data-dir /data --api-key=foundersignal-dev-key --enable-cors"
    ports:
      - "8108:8108"
    volumes:
      - foundersignal_typesense:/data

volumes:
  foundersignal_pg:
  foundersignal_typesense:
